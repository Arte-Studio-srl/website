# CI workflow for Next.js build verification
#
# Note: This project uses output: 'standalone' with API routes, so it cannot deploy
# to GitHub Pages (static-only). Deploy to Vercel, a Node.js host, or similar instead.
#
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Lint disabled: Next.js 16 removed the `lint` CLI command, and `eslint .` fails
      # due to yocto-queue ESM/CJS incompatibility with p-limit. Run `npm run lint`
      # locally if your environment supports it.
      # - name: Lint
      #   run: npm run lint

      - name: Build
        run: npm run build
