# CI workflow for Next.js build verification
#
# Note: This project uses output: 'standalone' with API routes, so it cannot deploy
# to GitHub Pages (static-only). Deploy to Vercel, a Node.js host, or similar instead.
#
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
