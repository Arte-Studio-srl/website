name = "artestudio-website"
compatibility_date = "2025-04-01"
pages_build_output_dir = "out"

# Bindings and env vars for this Pages project are configured in the CF dashboard:
#   Settings → Variables and Secrets:
#     NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET (build-time)
#     RESEND_API_KEY, CONTACT_FROM, CONTACT_TO (Function runtime)
#   Settings → Functions → Rate Limiting:
#     RATE_LIMITER → 3 requests / 60s (used by functions/api/contact.ts)
